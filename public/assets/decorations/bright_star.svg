<svg id="play" width="357" height="358" viewBox="0 0 357 358" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
/* Plays only when loaded as file.svg#play; BaseLayout adds #play when the image scrolls into view. */
/* Same "arrive" pulse as the north stars (no trail here), marking the About heading. Glow kept at 1.1 so it doesn't clip the viewBox. */
@media (prefers-reduced-motion: no-preference) {
  svg:target > * { transform-box: fill-box; transform-origin: center; --glow: 1.1; }
  svg:target > path { animation: arrive 7s infinite; }
  svg:target > g { animation: arrive-glow 7s infinite; }
}
@keyframes glint {
  0%, 100% { opacity: .5; transform: scale(1); }
  5% { opacity: 1; transform: scale(1.5); animation-timing-function: ease-in; }
  14% { opacity: .5; transform: scale(1); }
}
/* Ease-out swell, slower settle. The glow swells more than the star, so the light reads as arriving. */
@keyframes arrive {
  0%, 15% { transform: scale(1); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  21% { transform: scale(1.1); animation-timing-function: ease-in-out; }
  36%, 100% { transform: scale(1); }
}
@keyframes arrive-glow {
  0%, 15% { transform: scale(1); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  21% { transform: scale(var(--glow, 1.25)); animation-timing-function: ease-in-out; }
  36%, 100% { transform: scale(1); }
}
</style>

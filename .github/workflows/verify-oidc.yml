name: Verify OIDC deploy access

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::344275816419:role/scdmin-deploy
          aws-region: ap-southeast-1

      - name: Who are we
        run: aws sts get-caller-identity

      - name: Can we read the bucket (no writes)
        run: aws s3 ls "s3://awsscdmin-site-344275816419" | head -5

      - name: Can we see the fonts
        run: aws s3 ls "s3://awsscdmin-fonts-344275816419/fonts/"

      - name: Can we see the distribution
        run: |
          aws cloudfront get-distribution --id E187X07G5N98UI \
            --query "Distribution.{Status:Status,Domain:DomainName}"
